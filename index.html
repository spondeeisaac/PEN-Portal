<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0B6768">
  <meta name="application-name" content="PEN Portal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PEN Portal">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon"
        href="./icons/icon-192.png"
        sizes="192x192"
        type="image/png">
  <link rel="apple-touch-icon"
        href="./icons/apple-touch-icon.png">

  <title>PEN Portal</title>

  <style>
    :root{
      --teal:#0B6768;
      --teal-light:#179A99;
      --yellow:#FAD00F;
      --ink:#123B43;
      --muted:#61777B;
      --bg:#F4F7F7;
      --line:#D6E2E3;
      --white:#FFFFFF;
    }

    *{box-sizing:border-box}

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
    }

    body{
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }

    .app{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      background:var(--bg);
    }

    .app-bar{
      flex:0 0 52px;
      height:52px;
      min-height:52px;
      background:var(--teal);
      color:var(--white);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:0 10px;
      box-shadow:0 1px 5px rgba(0,0,0,.18);
      z-index:5;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
    }

    .brand-logo{
      width:34px;
      height:34px;
      flex:0 0 34px;
      border-radius:9px;
      background:#fff;
      object-fit:contain;
      padding:2px;
    }

    .brand-name{
      min-width:0;
      font-size:15px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:5px;
      flex-shrink:0;
    }

    .action{
      height:36px;
      min-width:36px;
      padding:0 9px;
      border:0;
      border-radius:8px;
      background:transparent;
      color:#fff;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
    }

    .action:active{
      background:rgba(255,255,255,.14);
    }

    .install{
      display:none;
      background:var(--yellow);
      color:var(--ink);
    }

    .install.show{
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .portal-wrap{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      width:100%;
      background:#fff;
    }

    #portalFrame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }

    .loading{
      position:absolute;
      inset:0;
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      transition:opacity .22s ease;
      pointer-events:none;
    }

    .loading.hidden{
      opacity:0;
    }

    .loading-inner{
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    .spinner{
      width:32px;
      height:32px;
      margin:0 auto 11px;
      border:3px solid #D9E6E6;
      border-top-color:var(--teal-light);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .offline{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:7;
      display:none;
      padding:9px 11px;
      border:1px solid #E9D86B;
      border-radius:10px;
      background:#FFF7D1;
      color:#6E5D00;
      font-size:12px;
      line-height:1.45;
      box-shadow:0 4px 16px rgba(0,0,0,.08);
    }

    .offline.show{
      display:block;
    }

    .ios-help{
      position:absolute;
      inset:0;
      z-index:20;
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      background:rgba(0,0,0,.45);
    }

    .ios-help.show{
      display:flex;
    }

    .ios-card{
      width:min(460px,100%);
      max-height:90%;
      overflow:auto;
      padding:21px;
      border-radius:18px;
      background:#fff;
      box-shadow:0 18px 55px rgba(0,0,0,.25);
    }

    .ios-card h2{
      margin:0 0 8px;
      font-size:21px;
      color:var(--ink);
    }

    .ios-card p{
      margin:0 0 12px;
      font-size:14px;
      line-height:1.55;
      color:var(--muted);
    }

    .step{
      margin:8px 0;
      padding:10px 11px;
      border:1px solid #E2ECEC;
      border-radius:9px;
      background:#F4F7F7;
      font-size:14px;
      line-height:1.45;
    }

    .close{
      width:100%;
      margin-top:12px;
      padding:12px;
      border:0;
      border-radius:9px;
      background:var(--teal);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    @media (max-width:600px){
      .app-bar{
        flex-basis:50px;
        height:50px;
        min-height:50px;
        padding:0 8px;
      }

      .brand-logo{
        width:32px;
        height:32px;
        flex-basis:32px;
      }

      .brand-name{
        font-size:14px;
      }

      .action{
        height:34px;
        min-width:34px;
        padding:0 7px;
      }
    }

    @media (max-width:380px){
      .brand-name{
        max-width:120px;
      }

      .install{
        padding:0 8px;
      }
    }

    @media (orientation:landscape) and (max-width:900px){
      .app-bar{
        flex-basis:46px;
        height:46px;
        min-height:46px;
      }

      .brand-logo{
        width:29px;
        height:29px;
        flex-basis:29px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="app-bar">
      <div class="brand">
        <img
          class="brand-logo"
          src="./icons/icon-192.png"
          alt="Practical Education Network">
        <span class="brand-name">PEN Portal</span>
      </div>

      <div class="actions">
        <button
          id="installBtn"
          class="action install"
          type="button">
          Install
        </button>

        <button
          id="refreshBtn"
          class="action"
          type="button"
          aria-label="Refresh portal"
          title="Refresh">
          ↻
        </button>
      </div>
    </header>

    <main class="portal-wrap">

      <div id="loading" class="loading">
        <div class="loading-inner">
          <div class="spinner"></div>
          <div>Opening PEN Portal…</div>
        </div>
      </div>

      <!-- DIRECT APPS SCRIPT: STRIKINGLY IS NOT USED -->
      <iframe
        id="portalFrame"
        title="PEN Portal"
        src="https://script.google.com/macros/s/AKfycbz4OAIXJVtUWOPUjIXz6WV4DWYLWepJsQMCshp5IKEa4efBcrtrisoXgmRqeLYfIyDicA/exec?view=login"
        allow="clipboard-read; clipboard-write; fullscreen; camera; microphone"
        allowfullscreen>
      </iframe>

      <div id="offline" class="offline">
        You are offline. PEN Portal needs an internet connection
        for live programme data.
      </div>

      <div id="iosHelp" class="ios-help">
        <div class="ios-card">
          <h2>Install PEN Portal on iPhone</h2>

          <p>
            iPhone installation is done through Safari.
          </p>

          <div class="step">
            <strong>1.</strong> Open this PEN Portal page in Safari.
          </div>

          <div class="step">
            <strong>2.</strong> Tap the <strong>Share</strong> button.
          </div>

          <div class="step">
            <strong>3.</strong> Select
            <strong>Add to Home Screen</strong>.
          </div>

          <div class="step">
            <strong>4.</strong> Tap <strong>Add</strong>.
          </div>

          <button
            id="iosClose"
            class="close"
            type="button">
            Close
          </button>
        </div>
      </div>

    </main>
  </div>

  <script>
    const PROD_URL =
      'https://script.google.com/macros/s/AKfycbz4OAIXJVtUWOPUjIXz6WV4DWYLWepJsQMCshp5IKEa4efBcrtrisoXgmRqeLYfIyDicA/exec';

    const frame =
      document.getElementById('portalFrame');

    const loading =
      document.getElementById('loading');

    const offline =
      document.getElementById('offline');

    const installBtn =
      document.getElementById('installBtn');

    const refreshBtn =
      document.getElementById('refreshBtn');

    const iosHelp =
      document.getElementById('iosHelp');

    const iosClose =
      document.getElementById('iosClose');

    let deferredInstallPrompt = null;


    frame.addEventListener('load', function () {
      loading.classList.add('hidden');
    });


    refreshBtn.addEventListener('click', function () {
      loading.classList.remove('hidden');

      try {
        frame.contentWindow.location.reload();
      } catch (error) {
        frame.src = frame.src;
      }
    });


    function updateNetwork() {
      offline.classList.toggle(
        'show',
        !navigator.onLine
      );
    }

    window.addEventListener('online', updateNetwork);
    window.addEventListener('offline', updateNetwork);

    updateNetwork();


    function isIOS() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === 'MacIntel' &&
          navigator.maxTouchPoints > 1
        )
      );
    }


    function isStandalone() {
      return (
        window.matchMedia(
          '(display-mode: standalone)'
        ).matches ||
        window.navigator.standalone === true
      );
    }


    /*
     * Android / Chrome install prompt.
     */
    window.addEventListener(
      'beforeinstallprompt',
      function (event) {

        event.preventDefault();

        deferredInstallPrompt = event;

        if (!isStandalone()) {
          installBtn.classList.add('show');
        }
      }
    );


    window.addEventListener(
      'appinstalled',
      function () {

        deferredInstallPrompt = null;

        installBtn.classList.remove('show');
      }
    );


    /*
     * iPhone does not expose beforeinstallprompt.
     * Show an Install button there as well.
     */
    if (isIOS() && !isStandalone()) {
      installBtn.classList.add('show');
    }


    installBtn.addEventListener(
      'click',
      async function () {

        if (deferredInstallPrompt) {

          deferredInstallPrompt.prompt();

          try {
            await deferredInstallPrompt.userChoice;
          } catch (error) {}

          deferredInstallPrompt = null;

          return;
        }


        if (isIOS()) {

          iosHelp.classList.add('show');

          return;
        }


        /*
         * For browsers that do not expose a native prompt,
         * guide the user rather than opening another site.
         */
        alert(
          'Use your browser menu and choose Install PEN Portal or Add to Home screen.'
        );
      }
    );


    iosClose.addEventListener(
      'click',
      function () {
        iosHelp.classList.remove('show');
      }
    );


    iosHelp.addEventListener(
      'click',
      function (event) {
        if (event.target === iosHelp) {
          iosHelp.classList.remove('show');
        }
      }
    );


    /*
     * Service worker caches only the PWA shell.
     * The Apps Script portal itself is intentionally not cached.
     */
    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        function () {

          navigator.serviceWorker
            .register(
              './service-worker.js',
              {scope: './'}
            )
            .catch(function () {});

        }
      );

    }
  </script>
</body>
</html>
