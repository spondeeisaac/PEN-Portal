<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#006b68">
  <meta name="description" content="PEN Portal">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>PEN Portal</title>
  <style>
    :root { color-scheme: light; --teal:#006b68; --yellow:#ffce2f; --ink:#17393b; --muted:#617477; }
    * { box-sizing:border-box; }
    html,body { height:100%; width:100%; margin:0; overflow:hidden; background:#f6f8f8; font-family:Arial,Helvetica,sans-serif; color:var(--ink); }
    #portalFrame { position:fixed; inset:0; display:block; width:100%; height:100%; border:0; background:#fff; }
    #loading { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:24px; background:#f6f8f8; }
    #loading .card { max-width:520px; width:100%; text-align:center; padding:28px; border:1px solid #d8e4e3; border-top:4px solid var(--yellow); border-radius:12px; background:#fff; box-shadow:0 5px 24px #17393b12; }
    #loading h1 { margin:0 0 10px; color:var(--teal); font-size:22px; }
    #loading p { margin:0; color:var(--muted); line-height:1.55; font-size:14px; }
    #offline { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:24px; background:#f6f8f8; }
    #offline .card { max-width:560px; width:100%; padding:28px; background:#fff; border:1px solid #d8e4e3; border-left:5px solid var(--yellow); border-radius:12px; }
    #offline h2 { margin:0 0 10px; color:var(--teal); font-size:21px; }
    #offline p { color:var(--muted); line-height:1.55; font-size:14px; }
    .btn { display:inline-block; border:0; border-radius:8px; padding:12px 16px; background:var(--teal); color:#fff; text-decoration:none; font-weight:700; margin:5px 6px 0 0; }
    .secondary { background:#4b6265; }
    @media (prefers-reduced-motion:no-preference) { .dot { display:inline-block; animation:pulse 1.25s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.3; } } }
  </style>
  <script>
    // Legacy field-visit shortcuts used the repository root with ?app=field-visits.
    // Preserve those links but send them to the dedicated offline app subdirectory.
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('app') === 'field-visits') {
          var target = new URL('field-visit/', window.location.href);
          target.search = window.location.search;
          target.hash = window.location.hash;
          window.location.replace(target.href);
          return;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <iframe id="portalFrame" title="PEN Cascade Portal" allow="clipboard-read; clipboard-write; geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="loading"><div class="card"><h1>PEN Cascade Portal</h1><p>Opening your secure portal <span class="dot">…</span></p></div></div>
  <div id="offline"><div class="card"><h2>The main portal needs an internet connection</h2><p>Your offline-first Field Visit App remains available for prepared school visits, local records, and later synchronization.</p><a class="btn" href="./field-visit/?app=field-visits">Open Field Visit App</a><a class="btn secondary" href="https://script.google.com/macros/s/AKfycbz4OAIXJVtUWOPUjIXz6WV4DWYLWepJsQMCshp5IKEa4efBcrtrisoXgmRqeLYfIyDicA/exec" target="_blank" rel="noopener">Open main portal directly</a></div></div>
  <script>
  (function () {
    'use strict';
    var PORTAL_URL = "https://script.google.com/macros/s/AKfycbz4OAIXJVtUWOPUjIXz6WV4DWYLWepJsQMCshp5IKEa4efBcrtrisoXgmRqeLYfIyDicA/exec";
    var TRUSTED_ORIGINS = {'https://script.google.com':true,'https://script.googleusercontent.com':true};
    var frame = document.getElementById('portalFrame');
    var loading = document.getElementById('loading');
    var offline = document.getElementById('offline');
    var mode = 'unknown';
    var fallbackTimer = null;

    function safeGet(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
    function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
    function safeRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }
    function cleanQuery() {
      try {
        if (window.history && history.replaceState) history.replaceState(null, '', window.location.pathname + window.location.hash);
      } catch (e) {}
    }
    function urlFor(view, token) {
      var u = new URL(PORTAL_URL);
      u.searchParams.set('view', view);
      u.searchParams.set('_pwa', '1');
      if (view === 'login') u.searchParams.set('embedded', '1');
      if (token) u.searchParams.set('token', token);
      u.searchParams.set('t', String(Date.now()));
      return u.href;
    }
    function showOffline() {
      var isOnline = navigator.onLine !== false;
      offline.style.display = isOnline ? 'none' : 'flex';
      if (!isOnline) { frame.style.visibility = 'hidden'; loading.style.display = 'none'; }
      else { frame.style.visibility = 'visible'; }
    }
    function loadLogin() {
      mode = 'login';
      if (fallbackTimer) clearTimeout(fallbackTimer);
      loading.style.display = 'flex';
      frame.style.visibility = 'visible';
      frame.src = urlFor('login', '');
    }
    function loadDashboard(token) {
      if (!token) return loadLogin();
      mode = 'dashboard';
      if (fallbackTimer) clearTimeout(fallbackTimer);
      loading.style.display = 'flex';
      frame.style.visibility = 'visible';
      frame.src = urlFor('dashboard', token);
    }

    // The Apps Script login page returns its token to this shell in embedded mode.
    window.addEventListener('message', function (event) {
      if (event.source !== frame.contentWindow) return;
      if (!TRUSTED_ORIGINS[event.origin]) return;
      var data = event.data || {};
      if (data.source === 'PEN_LOGIN_2026' && data.type === 'PEN_LOGIN_SUCCESS' && data.token) {
        safeSet('PEN_SESSION_TOKEN', String(data.token));
        if (data.account) safeSet('PEN_ACCOUNT', JSON.stringify(data.account));
        mode = 'dashboard';
        return;
      }
      if (data.type === 'PEN_SESSION_INVALID' && mode === 'dashboard') {
        safeRemove('PEN_SESSION_TOKEN');
        safeRemove('PEN_ACCOUNT');
        loadLogin();
      }
    });

    frame.addEventListener('load', function () {
      loading.style.display = 'none';
      showOffline();
    });
    window.addEventListener('offline', showOffline);
    window.addEventListener('online', function () {
      showOffline();
      if (mode === 'unknown' || mode === 'offline') {
        var token = safeGet('PEN_SESSION_TOKEN');
        token ? loadDashboard(token) : loadLogin();
      }
    });

    // A logout query is used by the portal's existing sign-out flow to clear the
    // shell's token and return to the embedded login, without leaving the PWA.
    var qs = new URLSearchParams(window.location.search);
    if (qs.get('logout') === '1') {
      safeRemove('PEN_SESSION_TOKEN');
      safeRemove('PEN_ACCOUNT');
      cleanQuery();
    } else {
      var urlToken = qs.get('token') || qs.get('sessionToken') || '';
      if (urlToken) safeSet('PEN_SESSION_TOKEN', urlToken);
      if (urlToken || qs.has('token') || qs.has('sessionToken') || qs.has('t')) cleanQuery();
    }

    if (navigator.onLine === false) {
      mode = 'offline';
      showOffline();
    } else {
      var token = safeGet('PEN_SESSION_TOKEN');
      token ? loadDashboard(token) : loadLogin();
    }

    if ('serviceWorker' in navigator) {
      var root = new URL('./', window.location.href);
      navigator.serviceWorker.register(new URL('sw.js', root).href, {scope: root.pathname})
        .then(function (registration) { registration.update().catch(function () {}); })
        .catch(function () {});
    }
  })();
  </script>
</body>
</html>
